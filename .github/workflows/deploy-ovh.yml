name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate pages
        run: |
          python generate.py
          python generate-pages.py

      - name: Deploy to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: ${{ secrets.OVH_FTP_USER }}
          password: ${{ secrets.OVH_FTP_PASS }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/__pycache__/**
            **/scripts/**
            .gitignore
            generate.py
            generate-pages.py
            generate-pages-NEW.py
            rewrite_generate_pages.py
            enrich_content.py
            enrich_period_content.py
            customize_widgets.py
            build-admin.py
            patch_seo.py
            patch_eeat.py
            icons.py
            calcul.py
            template-brut-net.html
            template-net-brut.html
            tailwind.config.js
            package.json
            package-lock.json
            css/input.css
            submit-bing.sh

      - name: Ping Google Sitemap
        if: success()
        run: |
          echo "Pinging Google sitemap..."
          curl -s "https://www.google.com/ping?sitemap=https://salairebrutonet.com/sitemap.xml"
          echo ""

      - name: Submit all URLs to IndexNow
        if: success()
        run: |
          echo "Extracting URLs from sitemap.xml..."
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<loc>//g;s/<\/loc>//g')
          URL_COUNT=$(echo "$URLS" | wc -l | tr -d ' ')
          echo "Found $URL_COUNT URLs to submit."

          URL_JSON=$(echo "$URLS" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Submitting to IndexNow..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"salairebrutonet.com\",
              \"key\": \"dc6156f9d98f4267ab490ed4b6606c7a\",
              \"keyLocation\": \"https://salairebrutonet.com/dc6156f9d98f4267ab490ed4b6606c7a.txt\",
              \"urlList\": $URL_JSON
            }")

          echo "IndexNow response: HTTP $HTTP_CODE ($URL_COUNT URLs submitted)"
